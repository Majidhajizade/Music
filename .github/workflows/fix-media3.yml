name: Fix Media3 and Push

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix Media3 version
        run: |
          sed -i \
            "s/androidx.media3:media3-session:1.10.1/androidx.media3:media3-session:1.8.0/" \
            app/build.gradle

          sed -i \
            "s/androidx.media3:media3-exoplayer:1.10.1/androidx.media3:media3-exoplayer:1.8.0/" \
            app/build.gradle

          grep -n "media3" app/build.gradle

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/build.gradle

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix Media3 compatibility with compileSdk 35"
          git push origin main
