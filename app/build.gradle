apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def releaseSigning = [
    storeFile: System.getenv("MUSIC_KEYSTORE_FILE"),
    storePassword: System.getenv("MUSIC_KEYSTORE_PASSWORD"),
    keyAlias: System.getenv("MUSIC_KEY_ALIAS"),
    keyPassword: System.getenv("MUSIC_KEY_PASSWORD")
]

def hasReleaseSigning = releaseSigning.values().every {
    it != null && !it.trim().isEmpty()
}

android {
    namespace 'com.music.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.music.app'
        minSdk 26
        targetSdk 35

        versionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName = System.getenv("VERSION_NAME") ?: "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false

            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
}
